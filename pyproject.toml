[project]
name = "pyraincloud"
version = "0.1.0"
description = "Rain cloud plots (half-violin + box + raw points) from pandas DataFrames in one call"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pavel Tsaturov", email = "astvacp@gmail.com" }
]
requires-python = ">=3.9"
keywords = ["raincloud", "visualization", "matplotlib", "pandas", "statistics", "plotting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.22",
    "pandas>=1.5",
    "scipy>=1.8",
]

[project.optional-dependencies]
# pip users: pip install -e ".[dev]"  (spec, appendix C)
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "build>=1.0",
    "twine>=4",
]

[project.urls]
Homepage = "https://github.com/noki1928/PyRainCloud"
Repository = "https://github.com/noki1928/PyRainCloud"
Issues = "https://github.com/noki1928/PyRainCloud/issues"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
# uv users: uv sync (same tools as the "dev" extra)
dev = ["pyraincloud[dev]"]
# Jupyter example and the user guide generator (docs/build_user_guide.py)
docs = [
    "ipykernel>=6",
    "nbclient>=0.7",
    "nbformat>=5",
    "python-docx>=1.1",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["SIM117"]

[tool.ruff.lint.per-file-ignores]
# long Russian prose and shell commands in the user guide generator
"docs/*" = ["E501"]
